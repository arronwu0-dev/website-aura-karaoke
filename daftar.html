<!DOCTYPE html>
<html lang="id" data-tema="gelap">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daftar Akun - Aura Karaoke</title>
<script>try{document.documentElement.dataset.tema=localStorage.getItem('aura2_tema')||'gelap'}catch(e){}</script>
<link rel="stylesheet" href="../Css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="logo-dot"></span>Aura&nbsp;<b>Karaoke</b></a>
  <nav class="tabs" aria-label="Menu utama">
    <a href="index.html" data-hal="beranda" data-utk="tamu,customer">Beranda</a>
    <a href="ruangan.html" data-hal="ruangan" data-utk="tamu,customer">Ruangan</a>
    <a href="dashboard.html" data-hal="dashboard" data-utk="customer">Dashboard</a>
    <a href="pesan-ruangan.html" data-hal="pesan" data-utk="customer">Pesan</a>
    <a href="riwayat.html" data-hal="riwayat" data-utk="customer">Riwayat</a>
    <a href="admin-dashboard.html" data-hal="a-dash" data-utk="admin">Panel</a>
    <a href="admin-ruangan.html" data-hal="a-ruangan" data-utk="admin">Ruangan</a>
    <a href="admin-pemesanan.html" data-hal="a-pemesanan" data-utk="admin">Pemesanan</a>
    <a href="admin-verifikasi.html" data-hal="a-verifikasi" data-utk="admin">Verifikasi<span class="cnt" id="cntBayar" hidden></span></a>
  </nav>
  <div class="bar-aksi">
    <button type="button" class="ikon-btn" id="btnTema" aria-label="Ganti tema terang atau gelap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <div id="notifWrap" hidden>
      <button type="button" class="ikon-btn" id="btnNotif" aria-label="Notifikasi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="notif-jml" id="notifCount" hidden></span></button>
      <div class="notif-panel" id="notifPanel" hidden><h4>Notifikasi</h4><ul id="notifList"></ul></div>
    </div>
    <span id="areaTamu"><a class="btn ghost sm" href="pilih.html#masuk">Masuk</a><a class="btn sm" href="pilih.html#daftar">Daftar</a></span>
    <span id="areaUser" hidden><span id="namaUser"></span><button type="button" class="btn ghost sm" id="btnKeluar">Keluar</button></span>
  </div>
</header>

<div class="wrap sempit"><div class="card form-kartu" style="max-width:none">
  <span class="label">Pelanggan baru</span>
  <h1>Buat akun</h1><p class="mut">Gratis, dan langsung bisa memesan setelah daftar.</p>
  <form id="formDaftar" novalidate>
    <label for="dn">Nama lengkap</label><input id="dn" autocomplete="name">
    <label for="de">Email</label><input id="de" type="email" autocomplete="email">
    <label for="dt">Nomor telepon</label><input id="dt" type="tel" autocomplete="tel" placeholder="08xxxxxxxxxx">
    <label for="dp">Kata sandi (minimal 8 karakter)</label><input id="dp" type="password" autocomplete="new-password">
    <div class="meter-sandi" id="meter"></div><span class="kecil mut" id="meterTeks"></span>
    <label for="dc">Konfirmasi kata sandi</label><input id="dc" type="password" autocomplete="new-password">
    <div id="pesan"></div>
    <button class="btn penuh" style="margin-top:.6rem">Daftar</button>
  </form>
  <p class="kecil mut" style="margin-top:1rem">Sudah punya akun? <a href="login.html">Masuk</a></p>
  <p class="kecil mut"><a href="pilih.html#daftar">&larr; Kembali ke pilihan situs</a></p>
</div></div>


<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><button type="button" class="x" data-tutup aria-label="Tutup">&times;</button><div id="modalIsi"></div></div></div>
<div id="toast" role="status"></div>

<script src="../Js/script.js"></script>
<script>
  initDaftar();
</script>
</body>
</html>
